[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hostcaps"
version = "0.1.0"
description = "Provider-neutral hosting capability discovery and compatibility matching"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "ONMAKE S.r.l."}]
keywords = ["nixos", "hosting", "capabilities", "portability", "fediversity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
hostcaps = "hostcaps.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
